<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pos-title pos-desc" id="competitive-positioning-root">
    <title id="pos-title">Competitive positioning map for Serambi.ai</title>
    <desc id="pos-desc">Two axes, adaptive learning and Bahasa Indonesia focus. Serambi.ai sits in the top left, the only player that starts from a career goal. Astra AI and Khanmigo are adaptive but not career-goal anchored for Indonesia.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #competitive-positioning-root { --paper:#f5f5f0; --paper-2:#ececec; --ink:#2d3142; --ink-strong:#111111;
    --muted:#4f5d75; --soft:#5a6580; --accent:#bf4520; --accent-tint:rgba(191,69,32,.08);
    --rule:rgba(45,49,66,.12); --link:#2e5aa8; }
      #competitive-positioning-root { font-family: Geist,system-ui,sans-serif; color: var(--ink); }
      #competitive-positioning-root .wrap { max-width:1280px;margin:0 auto;padding:24px 0 8px }
      #competitive-positioning-root .sub { font-family:"Geist Mono",monospace;font-size:10px;color:var(--soft) }
      #competitive-positioning-root .scroll { overflow-x:auto }
      #competitive-positioning-root text { font-family:Geist,system-ui,sans-serif }
      #competitive-positioning-root .mono { font-family:"Geist Mono",monospace }
      #competitive-positioning-root .node-t { font-family:Geist,system-ui,sans-serif;font-size:12px;font-weight:600;fill:var(--ink) }
      #competitive-positioning-root .node-s { font-family:"Geist Mono",monospace;font-size:9px;fill:var(--muted) }
      #competitive-positioning-root .ax { font-family:"Geist Mono",monospace;font-size:9px;fill:var(--ink);letter-spacing:.18em;text-transform:uppercase }
      #competitive-positioning-root .tag { font-family:"Geist Mono",monospace;font-size:8px;fill:var(--muted);letter-spacing:.18em;text-transform:uppercase }
      #competitive-positioning-root .focal-tag { font-family:"Geist Mono",monospace;font-size:8px;fill:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-weight:600 }
      #competitive-positioning-root .cell-t { font-family:Geist,system-ui,sans-serif;font-size:16px;font-weight:600;fill:var(--ink) }
      #competitive-positioning-root .cell-s { font-family:Geist,system-ui,sans-serif;font-size:11px;fill:var(--muted) }
      #competitive-positioning-root .cell-body { font-family:Geist,system-ui,sans-serif;font-size:11px;fill:var(--muted) }
      #competitive-positioning-root .dot { fill:var(--ink) }
      #competitive-positioning-root .focal .dot { fill:var(--accent) }</style>
      <marker id="competitive-positioning-pos-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#2d3142"/>
      </marker>
    </defs>

    <!-- axes: double-ended, 1.2px ink -->
    <path d="M400,340 L880,340" stroke="#2d3142" stroke-width="1.2" marker-start="url(#competitive-positioning-pos-arrow)" marker-end="url(#competitive-positioning-pos-arrow)"/>
    <path d="M640,100 L640,580" stroke="#2d3142" stroke-width="1.2" marker-start="url(#competitive-positioning-pos-arrow)" marker-end="url(#competitive-positioning-pos-arrow)"/>

    <!-- axis labels: one word per tip, 12px beyond -->
    <text class="ax" x="404" y="332" text-anchor="start">ADAPTIVE</text>
    <text class="ax" x="876" y="332" text-anchor="end">FIXED</text>
    <text class="ax" x="628" y="112" text-anchor="end">BAHASA INDONESIA</text>
    <text class="ax" x="652" y="572" text-anchor="start">ENGLISH</text>

    <!-- top-left: FOCAL -->
    <rect x="130" y="150" width="440" height="180" rx="6" fill="#bf4520" fill-opacity=".04"/>
    <rect x="130" y="150" width="440" height="180" rx="6" fill="#bf4520" fill-opacity=".08" stroke="#bf4520" stroke-width="1.2"/>
    <text class="focal-tag" x="146" y="174">01 · CAREER / INDONESIA</text>
    <text class="cell-t" x="146" y="204">Serambi.ai</text>
    <circle class="focal dot" cx="158" cy="228" r="4"/>
    <text class="cell-body" x="172" y="232">Career goal → weekly roadmap, in Bahasa Indonesia</text>
    <text class="cell-body" x="146" y="256">Scaffold-not-oracle: the agent refuses to answer directly</text>
    <text class="cell-body" x="146" y="276">1 agent live e2e, 5 in development</text>

    <!-- top-right: adaptive, English -->
    <rect x="810" y="150" width="440" height="180" rx="6" fill="#2d3142" fill-opacity=".04" stroke="#4f5d75" stroke-opacity=".28" stroke-width="1"/>
    <text class="tag" x="826" y="174">02 · ADAPTIVE / ENGLISH</text>
    <text class="cell-t" x="826" y="204">Khanmigo</text>
    <circle class="dot" cx="838" cy="228" r="4"/>
    <text class="cell-body" x="852" y="232">Adaptive, Socratic, K-12 — English only</text>
    <text class="cell-t" x="826" y="258">Astra AI</text>
    <circle class="dot" cx="838" cy="282" r="4"/>
    <text class="cell-body" x="852" y="286">15.2M users, adaptive, Bahasa Indonesia, exam-anchored</text>

    <!-- bottom-left: Bahasa Indonesia, fixed -->
    <rect x="130" y="400" width="440" height="180" rx="6" fill="#2d3142" fill-opacity=".04" stroke="#4f5d75" stroke-opacity=".28" stroke-width="1"/>
    <text class="tag" x="146" y="424">03 · FIXED / INDONESIA</text>
    <text class="cell-t" x="146" y="454">Dicoding · Ruangguru</text>
    <text class="cell-body" x="146" y="480">Bahasa Indonesia, catalogue-first</text>
    <text class="cell-t" x="146" y="512">Zenius · Cakap</text>
    <text class="cell-body" x="146" y="538">Fixed curriculum, no goal decomposition</text>

    <!-- bottom-right: fixed, English -->
    <rect x="810" y="400" width="440" height="180" rx="6" fill="#2d3142" fill-opacity=".04" stroke="#4f5d75" stroke-opacity=".28" stroke-width="1"/>
    <text class="tag" x="826" y="424">04 · FIXED / ENGLISH</text>
    <text class="cell-t" x="826" y="454">Boot.dev</text>
    <text class="cell-body" x="826" y="480">Opinionated path, $29/mo, English</text>
    <text class="cell-t" x="826" y="512">DataCamp</text>
    <text class="cell-body" x="826" y="538">Skill tracks, $25/mo, English</text>
    <text class="cell-t" x="1100" y="454">ChatGPT</text>
    <text class="cell-body" x="1100" y="480">Universal, low adapt</text>

  </svg>
